# mango config. See https://github.com/mangowm/mango/tree/main/docs
# Check it for errors with: mango -p

# DoxIA defaults (don't edit them; override below or in the files sourced here).
source=~/.local/state/doxia/mango/default/doxia.conf

# Your overrides. Loaded after the defaults, so the same option or a rebound
# key replaces DoxIA's.
#
# Monitor toggles (laptop display off, clamshell, SUPER+/ scale) come both
# before and after monitors.conf: mango applies the first matching monitor_rule
# to a new output but the last one on reload.
source_optional=~/.local/state/doxia/toggles/mango/monitors.conf
source=./monitors.conf
source_optional=~/.local/state/doxia/toggles/mango/monitors.conf
source=./input.conf
source=./looknfeel.conf
source=./bindings.conf
source=./autostart.conf
source=./windows.conf

# Toggles written by doxia-toggle-* and doxia-mango-* commands.
source_optional=~/.local/state/doxia/toggles/mango/transparency.conf
source_optional=~/.local/state/doxia/toggles/mango/input.conf
