# Input defaults. The system's keyboard layout (localectl) replaces this us
# through keyboard.conf, which doxia-mango-session writes at every login;
# ~/.config/mango/input.conf can set another one.

xkb_rules_layout=us
# CapsLock is the compose key.
xkb_rules_options=compose:caps

repeat_rate=40
repeat_delay=250
numlock_on=1

mouse_accel_profile=2
mouse_accel_speed=0.0

trackpad_natural_scrolling=0
trackpad_click_method=2
trackpad_scroll_factor=0.4
tap_to_click=1
trackpad_disable_while_typing=1
