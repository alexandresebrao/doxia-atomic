# Menus, toggles, captures, notifications and panels.

# DoxIA menu
bind=SUPER,space,spawn,doxia-menu toggle
# Iniciar
bind=SUPER+ALT,space,spawn,doxia-shell-call shell toggle doxia.iniciar
# Emojis
bind=SUPER+CTRL,E,spawn,doxia-shell-call shell toggle doxia.emojis
# Capture menu
bind=SUPER+CTRL,C,spawn,doxia-menu toggle capture
# Toggle menu
bind=SUPER+CTRL,O,spawn,doxia-menu toggle toggle
# Hardware menu
bind=SUPER+CTRL,H,spawn,doxia-menu toggle hardware
# DoxIA menu
bind=SUPER+SHIFT,code:201,spawn,doxia-menu toggle root
# System menu
bind=SUPER,Escape,spawn,doxia-menu toggle system
# Power menu
bindl=NONE,XF86PowerOff,spawn,doxia-menu toggle system
# Keybindings
bind=SUPER,K,spawn,doxia-menu-keybindings
# Tmux keybindings
bind=SUPER+ALT,K,spawn,doxia-menu-tmux-keybindings
# Herdr keybindings
bind=SUPER+CTRL,K,spawn,doxia-menu-herdr-keybindings
# Calculator
bind=SUPER+CTRL,Q,spawn,omacalc
# Calculator
bind=NONE,XF86Calculator,spawn,omacalc

# Toggle top bar
bind=SUPER+SHIFT,space,spawn,doxia-toggle-bar
# Background switcher
bind=SUPER+CTRL,space,spawn,doxia-menu toggle background
# Theme menu
bind=SUPER+SHIFT+CTRL,space,spawn,doxia-menu toggle theme
# Toggle window transparency
bind=SUPER,BackSpace,spawn,doxia-mango-window-transparency-toggle
# Toggle window gaps
bind=SUPER+SHIFT,BackSpace,togglegaps

# Dismiss last notification
bind=SUPER,comma,spawn,doxia-shell-call notifications dismissOne
# Dismiss all notifications
bind=SUPER+SHIFT,comma,spawn,doxia-shell-call notifications dismissAll
# Toggle silencing notifications
bind=SUPER+CTRL,comma,spawn,doxia-toggle-notification-silencing
# Invoke last notification
bind=SUPER+ALT,comma,spawn,doxia-shell-call notifications invokeLast
# Open notification history
bind=SUPER+SHIFT+ALT,comma,spawn,doxia-shell-call notifications showHistory

# Toggle locking on idle
bind=SUPER+CTRL,I,spawn,doxia-toggle-idle
# Toggle nightlight
bind=SUPER+CTRL,N,spawn,doxia-toggle-nightlight
# Toggle laptop display
bind=SUPER+CTRL,Delete,spawn,doxia-mango-monitor-internal toggle
# Toggle laptop display mirroring
bind=SUPER+CTRL+ALT,Delete,spawn,doxia-mango-monitor-internal-mirror toggle
switchbind=fold,spawn,doxia-system-lid-close
switchbind=unfold,spawn,doxia-mango-monitor-clamshell

# Screenshot
bind=NONE,Print,spawn,doxia-capture-screenshot
# Screenrecording
bind=ALT,Print,spawn_shell,doxia-capture-screenrecording --stop-recording || doxia-menu toggle trigger.capture.screenrecord
# Make webcam overlay smaller
bind=SUPER+ALT,code:34,spawn,doxia-capture-webcam-resize smaller
# Make webcam overlay larger
bind=SUPER+ALT,code:35,spawn,doxia-capture-webcam-resize larger
# Color picker
bind=SUPER,Print,spawn,doxia-capture-color
# Extract text (OCR) from screenshot
bind=SUPER+CTRL,Print,spawn,doxia-capture-text

# Share
bind=SUPER+CTRL,S,spawn,doxia-menu toggle share
# Transcode
bind=SUPER+CTRL,period,spawn,doxia-transcode

# Set reminder
bind=SUPER+CTRL,R,spawn,doxia-menu toggle reminder-set
# Show reminders
bind=SUPER+CTRL+ALT,R,spawn,doxia-reminder show
# Clear reminders
bind=SUPER+SHIFT+CTRL,R,spawn,doxia-reminder clear

# Show time
bind=SUPER+CTRL+ALT,T,spawn,doxia-notification-time
# Show battery remaining
bind=SUPER+CTRL+ALT,B,spawn,doxia-notification-battery
# Toggle weather
bind=SUPER+CTRL+ALT,W,spawn,doxia-notification-weather

# Agent
bind=SUPER+SHIFT+CTRL,A,spawn,doxia-agent --pick
# Audio
bind=SUPER+CTRL,A,spawn,doxia-shell-call shell toggle doxia.audio
# Bluetooth
bind=SUPER+CTRL,B,spawn,doxia-shell-call shell toggle doxia.bluetooth
# Display
bind=SUPER+CTRL,D,spawn,doxia-shell-call shell toggle doxia.monitor
# Calendar
bind=SUPER+CTRL+ALT,D,spawn,doxia-shell-call shell toggle doxia.clock
# Network
bind=SUPER+CTRL,W,spawn,doxia-shell-call shell toggle doxia.network
# Power
bind=SUPER+CTRL,P,spawn,doxia-shell-call shell toggle doxia.power
# Activity
bind=SUPER+CTRL,T,spawn,doxia-launch-or-focus-tui btop

# Bar panels by position: 1 is the leftmost panel in the bar's right section.
# Bar panel 1
bind=SUPER+CTRL,code:10,spawn,doxia-shell-call -q shell togglePanelAt right 1
# Bar panel 2
bind=SUPER+CTRL,code:11,spawn,doxia-shell-call -q shell togglePanelAt right 2
# Bar panel 3
bind=SUPER+CTRL,code:12,spawn,doxia-shell-call -q shell togglePanelAt right 3
# Bar panel 4
bind=SUPER+CTRL,code:13,spawn,doxia-shell-call -q shell togglePanelAt right 4
# Bar panel 5
bind=SUPER+CTRL,code:14,spawn,doxia-shell-call -q shell togglePanelAt right 5
# Bar panel 6
bind=SUPER+CTRL,code:15,spawn,doxia-shell-call -q shell togglePanelAt right 6
# Bar panel 7
bind=SUPER+CTRL,code:16,spawn,doxia-shell-call -q shell togglePanelAt right 7
# Bar panel 8
bind=SUPER+CTRL,code:17,spawn,doxia-shell-call -q shell togglePanelAt right 8
# Bar panel 9
bind=SUPER+CTRL,code:18,spawn,doxia-shell-call -q shell togglePanelAt right 9

# Lock system
bind=SUPER+CTRL,L,spawn,doxia-system-lock

# Keyboard control for the slurp region picker (doxia-capture-region switches
# to this mode while its selection layer is up, and back when it closes).
key_mode=selection
bind=NONE,Return,spawn,doxia-capture-region --take-window
bind=CTRL,Return,spawn,doxia-capture-region --take-fullscreen
bind=NONE,Tab,spawn,doxia-capture-region --select-window next
bind=CTRL,Tab,spawn,doxia-capture-region --select-window prev
bind=NONE,Left,spawn,doxia-capture-region --select-window left
bind=NONE,Right,spawn,doxia-capture-region --select-window right
bind=NONE,Up,spawn,doxia-capture-region --select-window up
bind=NONE,Down,spawn,doxia-capture-region --select-window down
bindp=NONE,Escape,setkeymode,default
key_mode=default
