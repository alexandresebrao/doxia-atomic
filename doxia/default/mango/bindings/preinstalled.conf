# Bindings for preinstalled DoxIA applications, TUIs, and web apps.
# doxia-mango-bindings leaves them out once doxia-remove-preinstalls ran.

# Tmux
bind=SUPER+ALT,Return,spawn,doxia-launch-terminal-tmux
# Herdr
bind=SUPER+CTRL,Return,spawn,doxia-launch-terminal-herdr
# Music
bind=SUPER+SHIFT,M,spawn,doxia-launch-spotify
# Music TUI
bind=SUPER+SHIFT+ALT,M,spawn,doxia-launch-or-focus-tui cliamp
# Docker
bind=SUPER+SHIFT,D,spawn,doxia-launch-tui doxia-launch-docker-tui
# Signal
bind=SUPER+SHIFT,G,spawn,doxia-launch-signal
# Obsidian
bind=SUPER+SHIFT,O,spawn,doxia-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
# Omawrite
bind=SUPER+SHIFT,W,spawn,uwsm-app -- omawrite
# Passwords
bind=SUPER+SHIFT,slash,spawn,doxia-launch-1password

# ChatGPT
bind=SUPER+SHIFT,A,spawn,doxia-launch-webapp https://chatgpt.com
# Grok
bind=SUPER+SHIFT+ALT,A,spawn,doxia-launch-webapp https://grok.com
# Calendar
bind=SUPER+SHIFT,C,spawn,doxia-launch-webapp https://app.hey.com/calendar/weeks/
# Email
bind=SUPER+SHIFT,E,spawn,doxia-launch-or-focus doxmail "uwsm-app -- doxmail"
# New email
bind=SUPER+SHIFT+ALT,E,spawn,uwsm-app -- doxmail mailto:
# YouTube
bind=SUPER+SHIFT,Y,spawn,doxia-launch-webapp https://youtube.com/
# WhatsApp
bind=SUPER+SHIFT+ALT,G,spawn,doxia-launch-or-focus-webapp WhatsApp https://web.whatsapp.com/
# Google Messages
bind=SUPER+SHIFT+CTRL,G,spawn,doxia-launch-or-focus-webapp "Google Messages" https://messages.google.com/web/conversations
# Google Photos
bind=SUPER+SHIFT,P,spawn,doxia-launch-or-focus-webapp "Google Photos" https://photos.google.com/
# Google Maps
bind=SUPER+SHIFT,S,spawn,doxia-launch-or-focus-webapp "Google Maps" https://maps.google.com/
# X
bind=SUPER+SHIFT,X,spawn,doxia-launch-webapp https://x.com/
# X Post
bind=SUPER+SHIFT+ALT,X,spawn,doxia-launch-webapp https://x.com/compose/post
