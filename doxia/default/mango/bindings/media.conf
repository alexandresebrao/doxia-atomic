# Volume, brightness, keyboard backlight, and touchpad controls. bindl works
# on the lock screen too.

# Volume up
bindl=NONE,XF86AudioRaiseVolume,spawn,doxia-audio-output-volume raise
# Volume down
bindl=NONE,XF86AudioLowerVolume,spawn,doxia-audio-output-volume lower
# Mute
bindl=NONE,XF86AudioMute,spawn,doxia-audio-output-volume mute-toggle
# Mute microphone
bindl=NONE,XF86AudioMicMute,spawn,doxia-audio-input-mute
# Brightness up
bindl=NONE,XF86MonBrightnessUp,spawn,doxia-brightness-display +5%
# Brightness down
bindl=NONE,XF86MonBrightnessDown,spawn,doxia-brightness-display 5%-
# Brightness maximum
bindl=SHIFT,XF86MonBrightnessUp,spawn,doxia-brightness-display 100%
# Brightness minimum
bindl=SHIFT,XF86MonBrightnessDown,spawn,doxia-brightness-display 1%
# Keyboard brightness up
bindl=NONE,XF86KbdBrightnessUp,spawn,doxia-brightness-keyboard up
# Keyboard brightness down
bindl=NONE,XF86KbdBrightnessDown,spawn,doxia-brightness-keyboard down
# Keyboard backlight cycle
bindl=NONE,XF86KbdLightOnOff,spawn,doxia-brightness-keyboard cycle
# Toggle touchpad
bindl=NONE,XF86TouchpadToggle,spawn,doxia-toggle-touchpad
# Enable touchpad
bindl=NONE,XF86TouchpadOn,spawn,doxia-toggle-touchpad on
# Disable touchpad
bindl=NONE,XF86TouchpadOff,spawn,doxia-toggle-touchpad off

# Volume up precise
bindl=ALT,XF86AudioRaiseVolume,spawn,doxia-audio-output-volume +1
# Volume down precise
bindl=ALT,XF86AudioLowerVolume,spawn,doxia-audio-output-volume -1
# Brightness up precise
bindl=ALT,XF86MonBrightnessUp,spawn,doxia-brightness-display +1%
# Brightness down precise
bindl=ALT,XF86MonBrightnessDown,spawn,doxia-brightness-display 1%-

# Next track
bindl=NONE,XF86AudioNext,spawn,doxia-shell-call media next
# Next track
bindl=ALT,XF86AudioPlay,spawn,doxia-shell-call media next
# Play/pause (XF86AudioPause is the same key)
bindl=NONE,XF86AudioPlay,spawn,doxia-shell-call media playPause
# Previous track
bindl=NONE,XF86AudioPrev,spawn,doxia-shell-call media previous
# Previous track
bindl=ALT+SHIFT,XF86AudioPlay,spawn,doxia-shell-call media previous
# Eject media
bindl=NONE,XF86Eject,spawn,eject

# Switch audio output
bindl=SHIFT,XF86AudioMute,spawn,doxia-audio-output-switch
# Switch media source
bindl=SHIFT,XF86AudioPlay,spawn,doxia-audio-source-switch

# Dictation (voxtype), when installed. F9 is push-to-talk: press and release
# are two binds on one key, which mango only allows with the c flag on both.
# Toggle dictation
bind=SUPER+CTRL,X,spawn_shell,command -v voxtype >/dev/null && voxtype record toggle
# Start dictation (push-to-talk)
bindc=NONE,F9,spawn_shell,command -v voxtype >/dev/null && voxtype record start
# Stop dictation (push-to-talk)
bindrc=NONE,F9,spawn_shell,command -v voxtype >/dev/null && voxtype record stop
