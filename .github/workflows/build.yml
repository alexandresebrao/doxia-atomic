# Builds the DoxIA image and publishes it to ghcr.io/alexandresebrao/doxia-atomic,
# split into layers by package and signed with cosign. Installed machines follow
# :latest with bootc upgrade. A v* tag (v0.1.0-alpha) also publishes the image
# as that release (:0.1.0-alpha); it has to match the Containerfile's
# DOXIA_VERSION. Pull requests are built and rechunked, not pushed.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Daily, to pick up Fedora and Universal Blue updates
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/doxia-atomic

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          version=$(sed -n 's/^ARG DOXIA_VERSION=//p' Containerfile)
          tags="latest ${{ github.sha }} 44-${{ github.run_number }}"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            if [[ ${GITHUB_REF#refs/tags/v} != "$version" ]]; then
              echo "Tag ${GITHUB_REF#refs/tags/} does not match DOXIA_VERSION $version" >&2
              exit 1
            fi
            tags+=" $version"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      # Rootful podman: the rechunk below runs privileged on the same storage.
      - name: Build
        run: sudo podman build --pull=newer -t localhost/doxia-atomic:build .

      # The Containerfile leaves the DoxIA part as one big layer that changes on
      # every build, so each bootc upgrade would download all of it. This splits
      # the image into layers by package (rpm-ostree's chunking, the image's own
      # rpm-ostree); with the published :latest as --previous-build the packing
      # stays the same from build to build, so an upgrade only downloads the
      # layers whose packages changed. Labels (version, containers.bootc) carry
      # over from the built image.
      - name: Rechunk
        run: |
          sudo podman run --rm --privileged --pull=never \
            -v /var/lib/containers:/var/lib/containers -v /var/tmp:/var/tmp \
            --entrypoint /usr/bin/rpm-ostree localhost/doxia-atomic:build \
            compose build-chunked-oci --bootc --format-version=2 --max-layers=120 \
            --from=localhost/doxia-atomic:build \
            --previous-build="docker://$IMAGE:latest" \
            --output=containers-storage:localhost/doxia-atomic:chunked
          sudo podman rmi localhost/doxia-atomic:build
          sudo podman inspect localhost/doxia-atomic:chunked \
            --format '{{ index .Labels "containers.bootc" }} {{ index .Labels "org.opencontainers.image.version" }} {{ len .RootFS.Layers }} layers'

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in $TAGS; do
            sudo podman push --digestfile /tmp/digest localhost/doxia-atomic:chunked "docker://$IMAGE:$tag"
          done
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ -n $COSIGN_PRIVATE_KEY ]] || { echo "No SIGNING_SECRET: image left unsigned"; exit 0; }
          cosign login ghcr.io -u "${{ github.actor }}" -p "$TOKEN"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE@${{ steps.push.outputs.digest }}"
