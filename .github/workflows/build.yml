# Builds the DoxIA image and publishes it to ghcr.io/alexandresebrao/doxia-atomic,
# signed with cosign. Installed machines follow :latest with bootc upgrade. A
# v* tag (v0.1.0-alpha) also publishes the image as that release (:0.1.0-alpha);
# it has to match the Containerfile's DOXIA_VERSION.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Daily, to pick up Fedora and Universal Blue updates
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/doxia-atomic

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          version=$(sed -n 's/^ARG DOXIA_VERSION=//p' Containerfile)
          tags="latest ${{ github.sha }} 44-${{ github.run_number }}"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            if [[ ${GITHUB_REF#refs/tags/v} != "$version" ]]; then
              echo "Tag ${GITHUB_REF#refs/tags/} does not match DOXIA_VERSION $version" >&2
              exit 1
            fi
            tags+=" $version"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: Build
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: doxia-atomic
          tags: ${{ steps.tags.outputs.tags }}
          containerfiles: ./Containerfile
          oci: true
          layers: true

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          [[ -n $COSIGN_PRIVATE_KEY ]] || { echo "No SIGNING_SECRET: image left unsigned"; exit 0; }
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE@${{ steps.push.outputs.digest }}"
